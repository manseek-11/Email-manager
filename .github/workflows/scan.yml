name: Scan Inbox

on:
  workflow_dispatch:
    inputs:
      email:
        required: true
      password:
        required: true
      max_emails:
        default: "500"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r email-manager/requirements.txt

      - run: python email_manager.py
        env:
          EMAIL_ID: ${{ github.event.inputs.email }}
          APP_PASSWORD: ${{ github.event.inputs.password }}
          MAX_EMAILS: ${{ github.event.inputs.max_emails }}

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
