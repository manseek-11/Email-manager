name: Delete Category

on:
  workflow_dispatch:
    inputs:
      email:
        required: true
      password:
        required: true
      category:
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python cleanup.py
        env:
          EMAIL_ID: ${{ github.event.inputs.email }}
          APP_PASSWORD: ${{ github.event.inputs.password }}
          CATEGORY: ${{ github.event.inputs.category }}
