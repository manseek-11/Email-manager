name: Unsubscribe Report

on:
  workflow_dispatch:
    inputs:
      email:
        required: true
      password:
        required: true

jobs:
  unsubscribe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r email-manager/requirements.txt

      - run: python email-manager/unsubscribe.py
        env:
          EMAIL_ID: ${{ github.event.inputs.email }}
          APP_PASSWORD: ${{ github.event.inputs.password }}

      - uses: actions/upload-artifact@v4
        with:
          name: unsubscribe-report
          path: reports/
